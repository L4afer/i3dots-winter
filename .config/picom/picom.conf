#################################
#     Dark Green Picom Config    #
#  Matches polybar / i3 / hypr   #
#################################

# ===================
#   Corners
# ===================
# Mirrors decoration.rounding = 10 from your Hyprland config
corner-radius = 0;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

round-borders = 2;

# ===================
#   Shadows
# ===================
shadow = true;
shadow-radius = 18;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-opacity = 0.55;

# Dark green shadow tint (from crust/mantle in your palette) instead of pure black
shadow-color = "#0a140f";

shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ===================
#   Fading
# ===================
fading = true;
fade-in-step = 0.045;
fade-out-step = 0.045;
fade-delta = 4;

# ===================
#   Opacity
# ===================
# Mirrors decoration.active_opacity / inactive_opacity from your Hyprland config
inactive-opacity = 0.85;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;

focus-exclude = [
  "class_g = 'kitty'"
];

opacity-rule = [
  "100:class_g = 'rofi'",
  "95:class_g = 'kitty' && focused",
  "85:class_g = 'kitty' && !focused",
  "100:class_g = 'Polybar'"
];

# ===================
#   Blur
# ===================
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-fixed = true;

blur-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

# ===================
#   General
# ===================
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";

# ===================
#   Window type settings
# ===================
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
  utility = { shadow = false; };
};

# ===================
#   Animations
# ===================
# NOTE: shadow/opacity/blur options above work with mainline picom.
# Smooth open/close/move animations (matching your Hyprland easeOutQuint /
# fade curves) require a picom fork that supports them, e.g.
# picom-jonaburg or FT-Labs' picom-animations. If you're running one of
# those forks, uncomment and tune the block below -- it mirrors the feel
# of your Hyprland "windowsIn"/"windowsOut"/"fadeIn"/"fadeOut" animations.

# animations = true;
# animation-stiffness = 220;
# animation-dampening = 20;
# animation-window-mass = 0.5;
# animation-for-open-window = "zoom";
# animation-for-close-window = "zoom";
# animation-for-transient-window = "slide-down";
