[colors]
mantle = #001107
crust = #06100a
text = #e2f2ff
red = #a4553f
mauve1 = #6bbf8e
mauve = #73a2c7
pink1 = #8fd6ab
flamingo = #b1c9dc
rosewater = #d8d9a7 
transparent = #00000000
transparentish = #001107
necorandom = #dace98
necorandom1 = #c8e6d0
borderc = #dace98
borderc1 = #c8e6d0

background = ${colors.transparentish}
text25 = ${colors.text}
background-alt = ${colors.blue}
foreground = ${colors.text}
primary = ${colors.mauve}
secondary = ${colors.mantle}
alert = ${colors.red}

[bar/toph]
monitor = ${env:MONITOR:}
width = 100%
height = 28pt
;radius = 13px
;border-top = 4px
border-color = ${colors.borderc}
border = 4px
;dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}
bottom = false
line-size = 6pt

padding-left = 0
margin-top = 5
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.flamingo}

font-0 = Departure Mono Nerd Font:size12;3

modules-left =  xworkspaces separator xwindow 
modules-right = pulseaudio battery1 battery2 memory cpu tray xkeyboard date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt
background-color = ${colors.rosewater}


[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.mauve}
label-active-foreground = ${colors.crust}
label-active-underline = ${colors.mauve}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
label-foreground = ${colors.text}
type = internal/xwindow
label = %title:0:45:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#52C47E}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
interval = 5
label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.text}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/battery1]
type = internal/battery
full-at = 100

format-discharging = <label-discharging>
format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.primary}
label-discharging = %percentage%%

format-full = <label-full>
format-full-prefix = "BAT "
format-full-prefix-foreground = ${colors.primary}
label-full = %percentage%%

format-charging = <label-charging>
format-charging-prefix = "BAT+ "
format-charging-prefix-foreground = ${colors.primary}
label-charging = %percentage%%

low-at = 1
battery = BAT1
adapter = ACAD
poll-interval = 1


[module/battery2]
type = internal/battery
full-at = 100

label-discharging = %percentage%%
label-full = %percentage%%
format-charging-prefix = "+"
format-charging-prefix-foregroud = ${colors.primary}
label-charging = %percentage%%

low-at = 1
battery = BAT0
adapter = ACAD
poll-interval = 1


[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#52C47E}%ifname%%{F#4A6B56} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#52C47E}%ifname%%{F-} %essid%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#52C47E}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

;date = %H:%M:%S-%Y/%m/%d
date = %H:%M:%S - %m/%d
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/tray]
type = internal/tray
; Configure position, spacing, etc.
tray-position = right
tray-spacing = 10

[module/text]
type = custom/text
format = <label>
format-background = #000
format-foreground = ${colors.primary}

label = "|"
