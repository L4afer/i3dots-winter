# ===============================
# Kitty Terminal - Clean Config
# ===============================

# Font settings
font_family Departure Mono Nerd Font
bold_font auto
italic_font auto
font_size 12.0

# Cursor settings
cursor_trail 1
cursor_trail_length 4
cursor_trail_fade_steps 4

# ANSI colors
color0                #172526
color1                #D2696C
color2                #73a2c7
color3                #FFD7AA
color4                #91C4C0
color5                #F9ADA0
color6                #73a2c7
color7                #a1a790
color8                #568270
color9                #D2696C
color10               #73a2c7
color11               #FFD7AA
color12               #91C4C0
color13               #F9ADA0
color14               #73a2c7
color15               #DBD2C7
background            #172526
foreground            #DBD2C7
cursor                #DBD2C7
# Transparency
background_opacity 0.75

# Padding
window_padding_width 10

# Scrolling
scrollback_lines 10000

# Window decorations
confirm_os_window_close 0

# Automatically run neofetch
#shell /usr/bin/env zsh -c 'neofetch; exec zsh'
shell /usr/bin/env zsh -c 'exec zsh'

enable_audible_bell no

