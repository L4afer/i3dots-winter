# ~/.config/betterlockscreen/betterlockscreen.conf
#
# Replicates the look of the reference hyprlock.conf:
#   - blurred + dimmed background        (background { blur_passes/blur_size, brightness })
#   - circular indicator, dark ring       (input-field { outer_color, inner_color })
#   - centered clock (HH:MM) + date       (label { text = %H:%M / %A, %B %d })
#
# Install:  yay -S betterlockscreen   (or build from https://github.com/betterlockscreen/betterlockscreen)
# Cache your wallpaper once:
#   betterlockscreen -u /path/to/wallpaper.png
# Then lock with:
#   betterlockscreen -l dimblur
# (the accompanying lock.sh below just wraps that call)

# --- background { } ---
# blur_passes = 3, blur_size = 7  -> betterlockscreen blur is 0-9, roughly maps to blur_size
blur_level=7

# brightness = 0.5 (dimmed) -> dim 0-100, higher = darker
dim_level=40

# --- fonts ---
# font_family = JetBrains Mono
font="JetBrains Mono"

# --- input-field { } ---
# outer_color = rgb(151515)
ring_color="151515"
ringvercolor="151515"
ringwrongcolor="880000"

# inner_color = rgb(200, 200, 200)
insidecolor="c8c8c8"
insidevercolor="c8c8c8"
insidewrongcolor="c8c8c8"

# font_color = rgb(10, 10, 10)  -- text drawn inside the indicator (dots), keep dark on light fill
text_color="0a0a0a"

# fade_on_empty / hide_input -> handled by i3lock-color internals, no direct betterlockscreen equiv
key_hl_color="c8c8c8"
bshl_color="c8c8c8"
separator_color="00000000"

# placeholder_text = "Password..."  -- betterlockscreen only lets you set state labels, not a placeholder
login_text="Password..."
verif_text="Verifying..."
wrong_text="Wrong!"

# --- label { text = %H:%M } ---
time_format="%H:%M"
time_font_size=72

# --- label { text = %A, %B %d } ---
date_format="%A, %B %d"
date_font_size=24

# login/verif/wrong text sizing (kept close to hyprlock's placeholder size)
login_font_size=24
verif_font_size=24
wrong_font_size=24

# --- misc ---
# grace = 0, no_fade_in -> betterlockscreen has no direct fade controls, left default
greeter_text=""
show_failed_attempts=false
